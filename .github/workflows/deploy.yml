name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit SHA, tag or branch) to deploy to production. Use to roll back."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-site
      url: https://ascii-banner.us
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=ascii-banner \
            --branch=main \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="$(git log -1 --pretty=%s | head -c 200)" \
            --commit-dirty=false
      - name: Verify production serves this build
        run: |
          entry=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' dist/index.html)
          for i in $(seq 1 12); do
            if curl -fsS https://ascii-banner.us/ | grep -q "$entry"; then
              echo "Live site serves $entry"; exit 0
            fi
            sleep 10
          done
          echo "::error::https://ascii-banner.us is not serving $entry after 2 minutes"
          exit 1
